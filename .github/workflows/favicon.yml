name: Deploy favicon

on:
  push:
    branches: [main]
    paths:
      - 'favicon-data.txt'
      - 'scripts/patch_favicon.py'
      - '.github/workflows/favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: favicon-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved favicon
        run: python scripts/patch_favicon.py
      - name: Commit favicon to dashboard
        run: |
          if git diff --quiet -- index.html; then
            echo "Favicon already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Momentum Radar favicon"
          git push
