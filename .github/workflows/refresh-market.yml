name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes around Stockholm market hours, Monday-Friday.
    # UTC window intentionally covers both CET and CEST trading hours.
    - cron: '*/15 7-16 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh delayed-live Stockholm data
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python scripts/update_market.py

      - name: Commit refreshed dashboard
        run: |
          if git diff --quiet -- index.html; then
            echo "No dashboard data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh delayed-live market data"
          git push
