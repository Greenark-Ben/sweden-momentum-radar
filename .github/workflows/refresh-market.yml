name: Refresh market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market.py'
      - 'scripts/update_sweden_large_cap.py'
      - 'scripts/patch_shared_market_ui.py'
      - 'scripts/catalyst_intelligence.py'
      - 'scripts/patch_catalyst_signal.py'
      - 'scripts/apply_reference_design.py'
      - 'scripts/patch_market_navigation.py'
      - '.github/workflows/refresh-market.yml'
  schedule:
    - cron: '*/15 7-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Swedish high-risk radar
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python scripts/update_market.py

      - name: Apply catalyst-aware trade signal
        run: python scripts/patch_catalyst_signal.py

      - name: Apply approved light reference design
        run: python scripts/apply_reference_design.py

      - name: Install Swedish market navigation
        run: python scripts/patch_market_navigation.py

      - name: Generate Sweden Large Cap 50 radar
        run: python scripts/update_sweden_large_cap.py

      - name: Enforce shared Swedish market UI parity
        run: python scripts/patch_shared_market_ui.py

      - name: Commit refreshed dashboards
        run: |
          if git diff --quiet -- index.html sweden-large-cap.html nasdaq.html; then
            echo "No dashboard data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sweden-large-cap.html nasdaq.html
          git commit -m "Refresh Swedish market radars"
          git push
