name: Refresh market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market.py'
      - 'scripts/update_nasdaq.py'
      - 'scripts/patch_nasdaq_ui.py'
      - 'scripts/patch_nasdaq_layout.py'
      - 'scripts/patch_nasdaq_view_toggle.py'
      - 'scripts/catalyst_intelligence.py'
      - 'scripts/patch_catalyst_signal.py'
      - 'scripts/apply_reference_design.py'
      - 'scripts/patch_market_navigation.py'
      - '.github/workflows/refresh-market.yml'
  schedule:
    - cron: '*/15 7-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Swedish market radar
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python scripts/update_market.py

      - name: Apply catalyst-aware trade signal
        run: python scripts/patch_catalyst_signal.py

      - name: Apply approved light reference design
        run: python scripts/apply_reference_design.py

      - name: Install multi-market navigation
        run: python scripts/patch_market_navigation.py

      - name: Generate NASDAQ Top 50 radar
        run: python scripts/update_nasdaq.py

      - name: Correct NASDAQ units and filters
        run: python scripts/patch_nasdaq_ui.py

      - name: Apply approved NASDAQ reference layout
        run: python scripts/patch_nasdaq_layout.py

      - name: Install real NASDAQ table compact toggle
        run: python scripts/patch_nasdaq_view_toggle.py

      - name: Commit refreshed dashboards
        run: |
          if git diff --quiet -- index.html nasdaq.html; then
            echo "No dashboard data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nasdaq.html
          git commit -m "Refresh Sweden and NASDAQ market radars"
          git push
